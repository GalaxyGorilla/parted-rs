[package]
name = "parted"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A clean-room, Rust-only disk partitioning tool"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/GalaxyGorilla/parted-rs"
